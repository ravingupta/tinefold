name: Publish engine to npm
on:
  push:
    tags: ["engine-v*"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tinefold-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - name: Tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        run: test "engine-v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"
      - run: npm publish --provenance   # provenance needs CI; prepublishOnly runs typecheck, tests and build
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
